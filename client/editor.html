<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequence — Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="editor-page">

  <!-- TOP BAR -->
  <header class="topbar editor-topbar">
    <div class="topbar-left">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
          <rect width="22" height="22" rx="6" fill="#534AB7"/>
          <path d="M6 11h10M6 7.5h6M6 14.5h8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Sequence
      </div>
      <span class="topbar-sep">/</span>
      <span class="topbar-filename" id="topbarFilename">Loading...</span>
    </div>
    <div class="topbar-right">
      <div class="edit-stats" id="editStats"></div>
      <button class="btn" onclick="undoAll()">Revert all</button>
      <button class="btn btn-secondary" onclick="autoClean()">
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1l1.5 4H13l-3.5 2.5 1.5 4L7 9l-4 2.5 1.5-4L1 5h4.5z" fill="currentColor"/></svg>
        Auto-clean
      </button>
      <button class="btn btn-primary" onclick="openExportPanel()">
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v8M3 8l4 4 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        Export
      </button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="editor-layout">

    <!-- LEFT: video preview + audio tools -->
    <aside class="left-panel">

      <div class="video-preview" id="videoPreview">
        <div class="video-placeholder">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <path d="M17 14l10 6-10 6V14z" fill="rgba(255,255,255,0.4)"/>
          </svg>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-label">Audio processing</div>

        <div class="audio-tool">
          <label class="tool-label">
            <span>Noise reduction</span>
            <input type="checkbox" id="opt-noise" checked>
            <span class="toggle-ui"></span>
          </label>
        </div>

        <div class="audio-tool">
          <label class="tool-label">
            <span>Compressor</span>
            <input type="checkbox" id="opt-comp" checked>
            <span class="toggle-ui"></span>
          </label>
        </div>

        <div class="audio-tool">
          <label class="tool-label">
            <span>Loudness normalize</span>
            <input type="checkbox" id="opt-loud" checked>
            <span class="toggle-ui"></span>
          </label>
          <div class="lufs-options" id="lufsOptions">
            <button class="lufs-btn active" data-lufs="-14">-14 <small>YouTube</small></button>
            <button class="lufs-btn" data-lufs="-16">-16 <small>Spotify</small></button>
            <button class="lufs-btn" data-lufs="-23">-23 <small>Broadcast</small></button>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-label">Filler words</div>
        <div class="filler-tags" id="fillerTags">
          <span class="filler-tag active" data-word="um">um</span>
          <span class="filler-tag active" data-word="uh">uh</span>
          <span class="filler-tag active" data-word="like">like</span>
          <span class="filler-tag active" data-word="you know">you know</span>
          <span class="filler-tag active" data-word="basically">basically</span>
          <span class="filler-tag active" data-word="literally">literally</span>
        </div>
        <p class="hint-text">Click to toggle. Right-click a word in transcript to add custom.</p>
      </div>
    </aside>

    <!-- RIGHT: transcript -->
    <main class="transcript-panel">
      <div class="transcript-toolbar">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="filler">Fillers</button>
          <button class="filter-tab" data-filter="silence">Silences</button>
          <button class="filter-tab" data-filter="cut">Marked for cut</button>
        </div>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M9.5 9.5l2.5 2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search transcript...">
        </div>
      </div>

      <div class="transcript-body" id="transcriptBody">
        <div class="transcript-loading">
          <div class="spinner"></div>
          Loading transcript...
        </div>
      </div>
    </main>
  </div>

  <!-- CONTEXT MENU -->
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-item" data-action="cut">
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M3 9a2 2 0 100-4 2 2 0 000 4zM11 5a2 2 0 100-4 2 2 0 000 4z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      Cut this word
    </div>
    <div class="ctx-item" data-action="bleep">
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10M5 4v6M9 3v8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
      Bleep / censor
    </div>
    <div class="ctx-item" data-action="mute">
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 5h10v4H2z" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5 5V3M9 5V3M5 9v2M9 9v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      Mute (silence)
    </div>
    <div class="ctx-item" data-action="cut-all-similar">
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 4h10M2 7h7M2 10h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      Cut all "<span id="ctxWordLabel"></span>"
    </div>
    <div class="ctx-divider"></div>
    <div class="ctx-item" data-action="restore">
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7a5 5 0 119 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M2 4v3h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
      Restore
    </div>
  </div>

  <!-- EXPORT PANEL -->
  <div class="export-overlay" id="exportOverlay" style="display:none">
    <div class="export-panel">
      <div class="export-header">
        <h2>Export video</h2>
        <button class="btn-icon" onclick="closeExportPanel()">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="export-summary" id="exportSummary"></div>
      <div class="export-format">
        <div class="section-label">Format</div>
        <div class="format-options">
          <label class="format-opt"><input type="radio" name="fmt" value="mp4" checked> MP4 <small>H.264, most compatible</small></label>
          <label class="format-opt"><input type="radio" name="fmt" value="mov"> MOV <small>ProRes, editing quality</small></label>
        </div>
      </div>
      <button class="btn btn-primary btn-full" id="renderBtn" onclick="startRender()">
        Render &amp; download
      </button>
      <div class="render-progress" id="renderProgress" style="display:none">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="renderBar" style="width:0%"></div>
        </div>
        <p class="progress-status" id="renderStatus">Rendering...</p>
      </div>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
